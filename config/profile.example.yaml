# Copy to config/profile.yaml and adjust. profile.yaml is gitignored (it holds personal data).

candidate:
  name: Іван
  resumeFile: ~/Hellkitchen/doc/CV/handmade/cv_ua_fullstack_v3.pdf
  englishLevel: A2
  # Free text for the scoring model: what you want and what you don't.
  preferences: |
    Шукаю Fullstack / Backend (Node.js) / Frontend (React) позицію на TypeScript, рівень Middle+/Senior.
    Пріоритет — продукти з AI: LLM, агенти, RAG, MCP, agentic-розробка.
    Тільки віддалено. Українські компанії або компанії з україномовною командою.
    Англійська — тільки читання технічної документації, розмовної немає. Вакансії з вимогою англійської до B2 показуй, але чесно вказуй, що там потрібна мова.

  # Never named in letters: employers, clients, industries. Experience is described neutrally instead.
  # Matching is case-insensitive from the word start, so a stem covers its forms ("факторинг" → "факторингу").
  neverMention: [Initech, Umbrella, GLOBEX, proptech, мікрокредит, lending, ломбард, pawnshop, факторинг, factoring, Contoso, ACME CORP, ACMECORP, HOOLI, VANDELAY]

  # Tap-to-copy fields shown on every vacancy for application forms.
  contact:
    fullName: Ім'я Прізвище
    email: you@example.com
    phone: "+380 00 000 0000"   # first group = country code (shown apart from the number)

filters:
  englishMax: B2          # hard ceiling; above candidate.englishLevel = shown with ⚠️ and listed last
  minSalaryUsd: 0         # 0 = don't filter by salary
  remoteOnly: true
  maxAgeDays: 3
  titleStopWords: [QA, PHP, Laravel, WordPress, Python, Java, .NET, "C#", Golang, Ruby, Flutter, iOS, Android, Intern, Trainee, Junior, DevOps, Designer, Дизайнер, Верстальник, Recruiter, SEO]
  excludeCompanies: []

scoring:
  notifyThreshold: 60     # 0-100; vacancies below it are archived silently
  maxAssessPerRun: 25     # Claude calls per run; the rest waits for the next run
  assessModel: sonnet
  letterModel: sonnet

sources:
  djinni:
    enabled: true
    common: {}
    feeds:
      # No english_level here: B1/B2 vacancies come through and are flagged; the bot applies filters.englishMax itself.
      - { primary_keyword: JavaScript }
      - { primary_keyword: Node.js }
      - { primary_keyword: Fullstack }
      - { primary_keyword: React.js }
      - { primary_keyword: ML AI, any_of_keywords: "TypeScript Node.js React" }
  dou:
    enabled: true
    common: { remote: "" }
    feeds:
      - { category: Node.js }
      - { category: Front End }
      - { category: AI/ML, search: TypeScript }
      - { category: AI/ML, search: Node.js }

  robota:
    enabled: true
    common: { scheduleId: "3" }   # 3 = віддалена робота
    feeds:
      - { keyWords: node.js }
      - { keyWords: typescript }
      - { keyWords: react }
      - { keyWords: javascript }
      - { keyWords: fullstack }
      - { keyWords: LLM }
      - { keyWords: AI engineer }

bot:
  scanIntervalMinutes: 10
  quietHours: "23-8"      # Kyiv time; no automatic scans at night
